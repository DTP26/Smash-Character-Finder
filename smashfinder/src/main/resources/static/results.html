<!DOCTYPE html>
<html>
<head>
  <title>Your Fighter Matches</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <label class="results-label" >Your best suited fighters!</label>

  <div class="results-container" id="resultsContainer"></div>

  <div class="empty-message"> No characters match your criteria! Try again with less mandatory preferences!</div>

  <div class="submit-section">
    <a href="index.html" class="return-btn">Try Again?</a>
  </div>
  
  <script>
    // places each resulting fighter into a fighter card, eventually all being 
    // stored in the results container
    const results = JSON.parse(localStorage.getItem('results')).sort() || [];
    const container = document.getElementById('resultsContainer');
    
    results.forEach(name => {
      const card = document.createElement('div');
      card.className = 'fighter-card';


      const img = document.createElement('img');
      const imgPath = `/fighterRenders/${name.toLowerCase()}.png`;
      img.src = imgPath;
      img.alt = name;

      const label = document.createElement('div');
      label.className = 'fighter-name';
      label.textContent = name;

      card.appendChild(img);
      card.appendChild(label);
      container.appendChild(card);
      
    });
  </script>
</body>
</html>
